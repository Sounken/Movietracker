name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Barrières qualité : lint + typecheck + build. Le lint est bloquant depuis que la
# dette de style a été soldée (emojis → lucide, next/image, règles react-hooks) ;
# il doit rester à zéro erreur/warning. Aucun secret nécessaire — migrations +
# déploiement côté serveur (le conteneur applique `prisma migrate deploy` au
# démarrage, via Coolify).
jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    # Valeurs FACTICES (pas des secrets) : le build ne se connecte à rien, mais
    # elles évitent qu'un module plante sur une variable d'env absente au build.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      TMDB_API_KEY: "dummy"
      SESSION_SECRET: "dummy-session-secret-for-build-only-0123456789"
      BLOB_READ_WRITE_TOKEN: "vercel_blob_rw_dummy_dummy"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
