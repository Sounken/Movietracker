# GlitchTip — suivi des erreurs et des performances, auto-hébergé.
#
# Dérivé du compose officiel (https://glitchtip.com/assets/compose.sample.yml),
# avec quatre écarts documentés plus bas. À déployer comme ressource Docker
# Compose dans Coolify, sur son propre sous-domaine.
#
# Les valeurs `changeme` doivent être remplacées avant le premier démarrage —
# voir README.md.

x-environment: &default-environment
  DATABASE_URL: postgres://glitchtip:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
  VALKEY_URL: redis://valkey:6379
  SECRET_KEY: ${SECRET_KEY}
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  EMAIL_URL: ${EMAIL_URL}

  # Le serveur MCP, la raison pour laquelle on a choisi GlitchTip : il expose
  # 17 outils sur https://<domaine>/mcp — incidents, transactions, spans,
  # détection de N+1, logs, disponibilité.
  GLITCHTIP_ENABLE_MCP: "True"

  # Requis par l'analyse de spans et la détection de tendances du MCP. Sans
  # lui les transactions fonctionnent, mais on perd le détail par span.
  GLITCHTIP_ENABLE_DUCKDB: "True"

  # Piloté depuis Coolify plutôt que figé ici : il faut ouvrir l'inscription le
  # temps de créer le premier compte, puis la refermer. En variable, ça se fait
  # en deux clics ; en dur, il faudrait éditer le fichier et redéployer deux
  # fois. Laissé fermé par défaut — une instance ouverte sur Internet se fait
  # peupler de comptes indésirables.
  ENABLE_USER_REGISTRATION: ${ENABLE_USER_REGISTRATION:-False}
  ENABLE_ORGANIZATION_CREATION: ${ENABLE_ORGANIZATION_CREATION:-False}

  ENABLE_ADMIN: "False"
  ENABLE_OPENAPI: "False"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: glitchtip
    # `max_locks_per_transaction` : absent du compose d'exemple, mais le
    # compose de développement de GlitchTip précise que la documentation
    # d'installation le recommande aux auto-hébergeurs. Une requête que
    # Postgres ne peut pas restreindre à une seule partition verrouille
    # toutes les partitions et tous leurs index ; le défaut de 64 est trop bas
    # et finit par faire échouer des requêtes une fois les données accumulées.
    command:
      - postgres
      - -c
      - max_locks_per_transaction=512
    volumes:
      - pg-data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 512M

  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  web:
    image: glitchtip/glitchtip:6
    restart: unless-stopped
    depends_on:
      - postgres
      - valkey
    environment:
      <<: *default-environment
      SERVER_ROLE: all_in_one
    # `expose` et non `ports` : on ne publie rien sur l'IP publique du VPS.
    #
    # Le compose officiel utilise `ports: 8000:8000`, ce qui suppose une
    # machine dédiée. Ici le port 8000 était déjà pris par un autre conteneur,
    # et le déploiement échouait sur « port is already allocated ».
    #
    # Publier le port serait de toute façon une mauvaise idée : le proxy de
    # Coolify atteint le conteneur par le réseau Docker interne, et c'est lui
    # qui porte le certificat. Un port ouvert en direct exposerait GlitchTip en
    # HTTP clair, en contournant TLS.
    expose:
      - "8000"
    volumes:
      - uploads:/code/uploads
    # Plafond mémoire explicite. Le VPS tourne déjà à saturation et a connu
    # deux incidents cette semaine : un service de supervision qui ferait
    # tomber l'application qu'il supervise serait un comble. 1 Go laisse de la
    # marge à la configuration tout-en-un tout en bornant le risque.
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  pg-data:
  uploads:
